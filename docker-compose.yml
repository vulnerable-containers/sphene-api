services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - 9000:9000
    volumes:
      - '.:/var/www/html'
    networks:
      - sphene
    depends_on:
      - mysql 
  nginx:
    image: nginx:1.23-alpine
    volumes:
      - ./docker/development/nginx/conf.d/api.conf.template:/etc/nginx/templates/api.conf.template:ro
      - ./docker/development/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./:/var/www/html
    environment:
      - API_PORT=${API_PORT:-8080}
    ports:
      - '${API_PORT:-8080}:${API_PORT:-8080}'
    networks:
      - sphene
  mysql:
    image: 'mysql/mysql-server:8.0'
    ports:
      - '${FORWARD_DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-api}'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${DB_DATABASE:-api}'
      MYSQL_USER: '${DB_USERNAME:-api}'
      MYSQL_PASSWORD: '${DB_PASSWORD:-api}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - 'sphene-mysql:/var/lib/mysql'
    networks:
      - sphene
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - '-p${DB_PASSWORD:-api}'
      retries: 3
      timeout: 5s
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    links:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: '${FORWARD_DB_PORT:-3306}'
      PMA_USER: '${DB_USERNAME:-api}'
      PMA_PASSWORD: '${DB_PASSWORD:-api}'
    ports:
      - '8000:80'
    networks:
      - sphene
networks:
  sphene:
    driver: bridge
volumes:
  sphene-mysql:
    driver: local
